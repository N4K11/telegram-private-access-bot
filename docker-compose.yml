services:
  bot:
    build: .
    command: python -m app.main
    env_file:
      - .env
    ports:
      - "127.0.0.1:${WEBAPP_PORT:-8080}:${WEBAPP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./backups:/app/backups

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bot_db
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: