[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-private-access-bot"
version = "0.1.0"
description = "Telegram bot for selling access to private channels with Stars and optional Crypto Pay."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22,<4.0",
  "SQLAlchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "APScheduler>=3.10,<4.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1.0",
  "black>=24.10,<26.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".vendor", ".tmp", ".tooling", "backups"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true