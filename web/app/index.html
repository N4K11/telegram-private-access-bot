<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Access Cabinet</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:light;--bg:#f3f5f1;--panel:rgba(255,255,255,.88);--text:#18342f;--muted:#60776f;--line:rgba(24,52,47,.08);--accent:#2e7e6d;--warn:#cb705d;--shadow:0 18px 42px rgba(24,52,47,.08);font-family:"Segoe UI",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,rgba(127,199,183,.24),transparent 24%),radial-gradient(circle at left center,rgba(169,210,234,.20),transparent 24%),var(--bg);color:var(--text)}.shell{width:min(1120px,100%);margin:0 auto;padding:18px 12px 36px}.hero,.card{background:var(--panel);border:1px solid rgba(255,255,255,.74);box-shadow:var(--shadow);backdrop-filter:blur(16px);border-radius:24px}.hero{padding:20px;display:grid;gap:10px}.hero h1{margin:0;font-size:clamp(28px,5vw,40px)}.hero p{margin:0;max-width:62ch;color:var(--muted);line-height:1.5}.eyebrow,.pill,.badge,.tag,.button,input,select{border-radius:999px;font:inherit}.eyebrow,.pill,.badge,.tag{display:inline-flex;align-items:center;gap:8px;width:fit-content;padding:7px 11px;border:1px solid var(--line);background:rgba(255,255,255,.75);color:var(--muted);font-size:12px;font-weight:700}.eyebrow{background:rgba(127,199,183,.16);color:var(--accent)}.badge.good,.tag.good{background:rgba(127,199,183,.16);color:var(--accent)}.badge.warn,.tag.warn{background:rgba(203,112,93,.12);color:#9a4636}.badge.info,.tag.info{background:rgba(169,210,234,.16);color:#24627d}.grid{display:grid;gap:14px;margin-top:16px}.cols2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.cols3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.card{padding:16px}.head,.row,.line,.toolbar,.actions,.pager,.tags{display:flex;flex-wrap:wrap;gap:10px}.head,.row,.line{justify-content:space-between}.head{align-items:center;margin-bottom:12px}.stack,.list{display:grid;gap:10px}.list{margin:0;padding:0;list-style:none}.item,.metric,.empty,.loading,.error{padding:14px;border-radius:18px;background:rgba(255,255,255,.7);border:1px solid var(--line)}.row{padding-bottom:8px;border-bottom:1px solid var(--line)}.row:last-child{padding-bottom:0;border-bottom:0}.label,.hint,.item small{color:var(--muted);font-size:13px}.value{text-align:right;font-weight:600}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.metric strong{display:block;font-size:24px;margin-top:4px}.chart{display:grid;gap:8px}.bar{height:10px;border-radius:999px;background:rgba(24,52,47,.06);overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#7fc7b7,var(--accent))}.button{appearance:none;border:0;padding:10px 14px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}.button.secondary{background:rgba(255,255,255,.8);color:var(--accent);border:1px solid rgba(46,126,109,.14);box-shadow:none}input,select{appearance:none;padding:10px 13px;background:rgba(255,255,255,.8);border:1px solid var(--line);color:var(--text)}input{flex:1 1 180px}.loading::before{content:"";display:inline-block;width:14px;height:14px;margin-right:10px;border-radius:50%;border:2px solid rgba(46,126,109,.18);border-top-color:var(--accent);animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media (max-width:720px){.row{flex-direction:column;align-items:flex-start}.value{text-align:left}}
</style></head><body><main class="shell"><section class="hero"><span class="eyebrow">Telegram Mini App</span><h1>Кабинет доступа</h1><p>Подписка, продукты, тарифы, оплаты, промокоды и поддержка в одном минималистичном кабинете внутри Telegram.</p><div class="tags" id="hero-meta"></div></section><section class="grid cols2" id="app"><article class="card"><div class="loading">Загружаю кабинет...</div></article></section></main><script>
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;if(tg){tg.ready();tg.expand()}const app=document.getElementById('app'),meta=document.getElementById('hero-meta'),basePath=window.location.pathname.replace(/\/$/,'')||'/cabinet',initData=(tg&&tg.initData)||new URLSearchParams(window.location.search).get('initData')||'',state={usersPage:1,paymentsPage:1};
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const tags=items=>items&&items.length?`<div class="tags">${items.map(i=>`<span class="tag ${esc(i.kind||'')}">${esc(i.label)}</span>`).join('')}</div>`:'';
const rows=items=>items.filter(Boolean).map(i=>`<div class="row"><span class="label">${esc(i.label)}</span><span class="value">${esc(i.value??'—')}</span></div>`).join('');
const list=(items,fn,empty)=>items&&items.length?`<ul class="list">${items.map(i=>`<li class="item">${fn(i)}</li>`).join('')}</ul>`:`<div class="empty">${esc(empty)}</div>`;
const chart=items=>{if(!items||!items.length)return'<div class="empty">Нет данных для графика.</div>';const max=Math.max(...items.map(i=>Number(i.value||0)),1);return`<div class="chart">${items.map(i=>`<div><div class="line"><small>${esc(i.label)}</small><strong>${esc(i.value)}</strong></div><div class="bar"><div class="fill" style="width:${Math.max(8,Math.round(Number(i.value||0)/max*100))}%"></div></div></div>`).join('')}</div>`};
const card=(title,badge,body,badgeCls='')=>`<article class="card"><div class="head"><h3>${esc(title)}</h3><span class="badge ${badgeCls}">${esc(badge)}</span></div><div class="stack">${body}</div></article>`;
const metricGrid=s=>`<div class="metrics"><div class="metric"><span class="label">Пользователи</span><strong>${esc(s.total_users)}</strong></div><div class="metric"><span class="label">Активные подписки</span><strong>${esc(s.active_subscriptions)}</strong></div><div class="metric"><span class="label">Выручка сегодня</span><strong>${esc(s.revenue_today)}</strong></div><div class="metric"><span class="label">Выручка 30 дней</span><strong>${esc(s.revenue_30_days)}</strong></div><div class="metric"><span class="label">Stars оплат</span><strong>${esc(s.stars_payments)}</strong></div><div class="metric"><span class="label">Crypto оплат</span><strong>${esc(s.crypto_payments)}</strong></div></div>`;
const openTelegram=url=>{if(!url)return;if(tg&&typeof tg.openTelegramLink==='function'){tg.openTelegramLink(url);return}window.open(url,'_blank','noopener')};
const attachTelegramButtons=scope=>scope.querySelectorAll('[data-open-telegram]').forEach(btn=>btn.addEventListener('click',()=>openTelegram(btn.dataset.openTelegram||'')));
async function request(path,options={}){const response=await fetch(path,options);const payload=await response.json().catch(()=>({}));if(!response.ok||payload.ok===false)throw new Error(payload&&payload.error?payload.error:`HTTP ${response.status}`);return payload}
const pager=(kind,page,total)=>`<div class="pager"><button class="button secondary" type="button" data-kind="${kind}" data-dir="prev" ${page<=1?'disabled':''}>Назад</button><span class="pill">Страница ${esc(page)} / ${esc(total)}</span><button class="button secondary" type="button" data-kind="${kind}" data-dir="next" ${page>=total?'disabled':''}>Далее</button></div>`;
const usersList=d=>list(d.items||[],i=>`<strong>${esc(i.display_name||'Пользователь')}</strong><div class="line"><small>ID ${esc(i.telegram_id||'—')} • ${esc(i.status||'—')}</small><small>${esc(i.total_paid||0)} Stars • ${esc(i.paid_count||0)} оплат</small></div><div class="line"><small>${esc(i.role||'user')}${i.is_blocked?' • blocked':''}</small><small>${esc(i.last_seen_at_label||'—')}</small></div>`,'Пользователи по этому фильтру не найдены.')+pager('users',d.page,d.total_pages);
const paymentsList=d=>list(d.items||[],i=>`<strong>${esc(i.user_display_name||'Пользователь')} • ${esc(i.amount_label||'—')}</strong><div class="line"><small>${esc(i.provider_label||i.provider||'—')} • ${esc(i.status||'—')}</small><small>${esc(i.tariff_name||'Без тарифа')}</small></div><div class="line"><small>${esc(i.channel_title||'Без канала')}</small><small>${esc(i.paid_at_label||i.created_at_label||'без даты')}</small></div>`,'Платежи по этому фильтру не найдены.')+pager('payments',d.page,d.total_pages);
const tariffView=(t,p)=>{const tagItems=[];if(t.is_featured||t.id===p.featured_tariff_id)tagItems.push({label:'Featured',kind:'good'});if(t.is_default_offer||t.id===p.default_tariff_id)tagItems.push({label:'Default',kind:'info'});if(t.offer_group)tagItems.push({label:`Bundle: ${t.offer_group}`,kind:'warn'});if(t.is_trial)tagItems.push({label:'Trial',kind:'info'});if(t.is_lifetime)tagItems.push({label:'Lifetime',kind:'good'});const duration=t.is_lifetime?'Навсегда':`${esc(t.duration_days)} дн.`;const compare=[t.price_per_day_label,t.savings_label].filter(Boolean).join(' • ');return`<strong>${esc(t.name||'Тариф')}</strong>${tags(tagItems)}<div class="line"><small>${duration} • ${esc(t.price_stars)} Stars</small><small>${esc(compare||'без сравнения')}</small></div>${t.offer_copy?`<div>${esc(t.offer_copy)}</div>`:''}`};
function renderAdmin(data){const summary=data.summary?`<section class="stack">${metricGrid(data.summary)}${card('Воронка',`${data.summary.conversion_paid||0} оплат`,chart([{label:'/start',value:data.summary.conversion_started||0},{label:'Buy screen',value:data.summary.conversion_buy_viewed||0},{label:'Product',value:data.summary.conversion_product_selected||0},{label:'Tariff',value:data.summary.conversion_tariff_opened||0},{label:'Invoice',value:data.summary.conversion_invoice_created||0},{label:'Paid',value:data.summary.conversion_paid||0},{label:'Invite',value:data.summary.conversion_invite_issued||0}]),'good')}${card('Повторные покупки',`${data.summary.repeat_purchase_users||0}`,rows([{label:'Повторные покупатели',value:data.summary.repeat_purchase_users||0},{label:'Invite issued',value:data.summary.conversion_invite_issued||0}]))}${card('Продукты',`${(data.product_funnel||data.summary.product_funnel||[]).length}`,chart((data.product_funnel||data.summary.product_funnel||[]).slice(0,5).map(i=>({label:i.channel_title||`Канал #${i.channel_id}`,value:i.paid_users||0}))))}</section>`:'';
const users=data.users_preview?`<article class="card"><div class="head"><h3>Пользователи</h3><span class="badge">${esc(data.users_preview.total_items)}</span></div><div class="toolbar"><label for="uf">Фильтр</label><select id="uf">${(data.users_preview.available_filters||[]).map(i=>`<option value="${esc(i.key)}"${i.key===data.users_preview.filter_key?' selected':''}>${esc(i.label)}</option>`).join('')}</select><input id="uq" type="search" placeholder="Поиск по имени, @username или ID" value="${esc(data.users_preview.query||'')}"><button class="button secondary" type="button" id="ua">Обновить</button></div><div id="ul">${usersList(data.users_preview)}</div></article>`:'';
const payments=data.payments_preview?`<article class="card"><div class="head"><h3>Платежи</h3><span class="badge">${esc(data.payments_preview.total_items)}</span></div><div class="toolbar"><label for="pf">Провайдер</label><select id="pf">${(data.payments_preview.available_filters||[]).map(i=>`<option value="${esc(i.key)}"${i.key===data.payments_preview.provider_filter?' selected':''}>${esc(i.label)}</option>`).join('')}</select><input id="pq" type="search" placeholder="Поиск по пользователю, тарифу или ID" value="${esc(data.payments_preview.query||'')}"><button class="button secondary" type="button" id="pa">Обновить</button></div><div id="pl">${paymentsList(data.payments_preview)}</div></article>`:'';
const support=data.support?card('Тикеты',`${data.support.awaiting_admin_count||0} ждут админа`,rows([{label:'Открыто',value:data.support.open_count},{label:'Закрыто',value:data.support.closed_count},{label:'Ждут админа',value:data.support.awaiting_admin_count},{label:'Ждут пользователя',value:data.support.awaiting_user_count},{label:'Просрочено >24ч',value:data.support.stale_open_count}])+list(data.support.recent||[],i=>`<strong>#${esc(i.id)} • ${esc(i.user_display_name||'Пользователь')}</strong><div class="line"><small>${esc(i.category_label||i.category||'—')}</small><small>${esc(i.status_label||'—')}</small></div><div class="line"><small>${esc(i.waiting_state||'—')}</small><small>${esc(i.updated_at_label||'—')}</small></div>`,'Тикетов пока нет.'),data.support.awaiting_admin_count?'warn':'good'):'';
const promos=data.promos?card('Промокоды',`${data.promos.active_count} active`,rows([{label:'Активно',value:data.promos.active_count},{label:'Pending redemptions',value:data.promos.pending_redemptions}])+list(data.promos.recent||[],i=>`<strong>${esc(i.code)} • ${esc(i.value_label||'—')}</strong><div class="line"><small>${esc(i.promo_type_label||i.promo_type||'—')}</small><small>${i.is_active?'active':'disabled'}</small></div>`,'Промокодов пока нет.')):'';
const tariffs=data.tariffs?card('Тарифы',`${data.tariffs.active_count} active`,rows([{label:'Активно',value:data.tariffs.active_count},{label:'Выключено',value:data.tariffs.inactive_count}])+list(data.tariffs.items||[],i=>`<strong>${esc(i.name||'Тариф')}</strong><div class="line"><small>${esc(i.duration_days)} дн.</small><small>${esc(i.price_stars)} Stars</small></div>`,'Тарифов пока нет.')):'';
const broadcasts=data.broadcasts?card('Рассылки',`${data.broadcasts.total_count}`,rows([{label:'Всего кампаний',value:data.broadcasts.total_count},{label:'Running',value:data.broadcasts.active_count}])+list(data.broadcasts.recent||[],i=>`<strong>#${esc(i.id)} • ${esc(i.filter_name||'segment')}</strong><div class="line"><small>${esc(i.status||'—')}</small><small>${esc(i.sent_count||0)} / ${esc(i.total_targets||0)}</small></div>`,'Рассылок пока нет.')):'';
const channels=data.channels?card('Каналы',`${data.channels.active_count} active`,rows([{label:'Всего',value:data.channels.total_count},{label:'Без invite permission',value:data.channels.invite_warning_count},{label:'Без restrict permission',value:data.channels.restrict_warning_count}])+list(data.channels.items||[],i=>`<strong>${esc(i.title||'Канал')}</strong><div class="line"><small>${esc(i.telegram_chat_id||'—')}</small><small>${i.is_active?'active':'disabled'}</small></div>`,'Каналов пока нет.')):'';
const crypto=data.crypto_invoices?card('Crypto invoices',`${data.crypto_invoices.pending_count} pending`,rows([{label:'Pending',value:data.crypto_invoices.pending_count},{label:'Paid',value:data.crypto_invoices.paid_count},{label:'Expired',value:data.crypto_invoices.expired_count}])+list(data.crypto_invoices.recent||[],i=>`<strong>#${esc(i.id)} • ${esc(i.amount||'—')} ${esc(i.asset||'')}</strong><div class="line"><small>User #${esc(i.user_id||'—')}</small><small>${esc(i.status||'—')}</small></div>`,'Инвойсов пока нет.')):'';
const diagnostics=data.capabilities&&data.capabilities.diagnostics?`<section class="card"><div class="head"><h3>Проверка канала</h3><button class="button" type="button" id="cc">Запустить live-check</button></div><div id="ccr" class="hint">Проверка ещё не запускалась из Mini App.</div></section>`:'';
const anomalies=data.anomalies?`<section class="card"><div class="head"><h3>Аномалии</h3><span class="badge ${data.anomalies.length?'warn':'good'}">${esc(data.anomalies.length)}</span></div>${list(data.anomalies||[],i=>`<strong>${esc(i.event_name||'critical_error')}</strong><div class="line"><small>${esc(i.source||'runtime')}</small><small>${esc(i.occurred_at_label||'—')}</small></div><small>${esc(i.message||'—')}</small>`,'Критических ошибок пока нет.')}</section>`:'';
return`<article class="card" style="grid-column:1/-1"><div class="head"><h2>Админ-дашборд</h2><span class="badge good">Обновлено ${esc(data.generated_at_label||'только что')}</span></div><div class="stack">${summary}<section class="grid cols2">${users}${payments}</section><section class="grid cols3">${crypto}${support}${promos}${tariffs}${broadcasts}${channels}</section>${diagnostics}${anomalies}</div></article>`}
function attachControls(){attachTelegramButtons(app);const ua=document.getElementById('ua'),pa=document.getElementById('pa'),cc=document.getElementById('cc');if(ua)ua.addEventListener('click',()=>{state.usersPage=1;loadAdminUsers()});if(pa)pa.addEventListener('click',()=>{state.paymentsPage=1;loadAdminPayments()});if(cc)cc.addEventListener('click',runChannelCheck);app.querySelectorAll('[data-kind]').forEach(btn=>btn.addEventListener('click',()=>{const kind=btn.dataset.kind,dir=btn.dataset.dir;if(kind==='users'){state.usersPage=Math.max(1,state.usersPage+(dir==='next'?1:-1));loadAdminUsers()}if(kind==='payments'){state.paymentsPage=Math.max(1,state.paymentsPage+(dir==='next'?1:-1));loadAdminPayments()}}))}
async function loadAdminUsers(){const box=document.getElementById('ul'),filter=document.getElementById('uf'),query=document.getElementById('uq');if(!box||!filter||!query)return;box.innerHTML='<div class="loading">Обновляю список пользователей...</div>';const params=new URLSearchParams({filter:filter.value||'all',query:query.value||'',page:String(state.usersPage)});try{const payload=await request(`${basePath}/api/admin/users?${params.toString()}`,{headers:{'X-Telegram-Init-Data':initData}});state.usersPage=Number(payload.data.page||1);box.innerHTML=usersList(payload.data||{});attachControls()}catch(error){box.innerHTML=`<div class="error">${esc(error.message||'Не удалось загрузить пользователей.')}</div>`}}
async function loadAdminPayments(){const box=document.getElementById('pl'),filter=document.getElementById('pf'),query=document.getElementById('pq');if(!box||!filter||!query)return;box.innerHTML='<div class="loading">Обновляю платежи...</div>';const params=new URLSearchParams({provider:filter.value||'all',query:query.value||'',page:String(state.paymentsPage)});try{const payload=await request(`${basePath}/api/admin/payments?${params.toString()}`,{headers:{'X-Telegram-Init-Data':initData}});state.paymentsPage=Number(payload.data.page||1);box.innerHTML=paymentsList(payload.data||{});attachControls()}catch(error){box.innerHTML=`<div class="error">${esc(error.message||'Не удалось загрузить платежи.')}</div>`}}
async function runChannelCheck(){const box=document.getElementById('ccr'),button=document.getElementById('cc');if(!box||!button)return;button.disabled=true;box.innerHTML='<div class="loading">Запускаю live-check каналов...</div>';try{const payload=await request(`${basePath}/api/admin/actions/channel-check`,{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData},body:'{}'});box.innerHTML=list(payload.data.results||[],i=>`<strong>${esc(i.title||'Канал')}</strong><div class="line"><small>${i.overall_ok?'ok':'problem'}</small><small>${esc(i.telegram_chat_id||'—')}</small></div><small>${esc((i.recommendations||[]).join(' | ')||'Проблем не найдено.')}</small>`,'Каналы для проверки не найдены.')}catch(error){box.innerHTML=`<div class="error">${esc(error.message||'Проверка канала не удалась.')}</div>`}finally{button.disabled=false}}
function renderCabinet(data,adminData){const viewer=data.viewer||{},profile=data.profile||{},referrals=data.referrals||{},payments=data.recent_payments||[],tariffs=data.tariffs||[],products=data.products||[],activeProducts=data.active_products||[],promos=data.pending_promos||[],support=data.support||{},actions=data.actions||{},activeMap=new Map(activeProducts.map(i=>[String(i.channel_id),i]));meta.innerHTML=[viewer.display_name||`ID ${viewer.telegram_id||'—'}`,profile.status_label||'Без статуса',viewer.is_admin?'Есть админ-доступ':'Пользовательский режим'].filter(Boolean).map(i=>`<span class="pill">${esc(i)}</span>`).join('');
const productBlock=products.length?list(products,p=>{const active=activeMap.get(String(p.channel_id)),tagItems=[];if(p.bundle_names&&p.bundle_names.length)tagItems.push({label:`Bundles: ${p.bundle_names.join(', ')}`,kind:'info'});if(p.featured_tariff_id)tagItems.push({label:'Есть featured-оффер',kind:'good'});if(p.default_tariff_id)tagItems.push({label:'Есть default-оффер',kind:'warn'});return`<strong>${esc(p.title||'Продукт')}</strong>${tags(tagItems)}<div class="line"><small>${esc(p.price_range_label||'—')} • ${esc(p.tariff_count||0)} тарифов</small><small>${esc(active?`Активно до ${active.latest_expires_at_label||'—'}`:'Нет активного доступа')}</small></div>${list(p.tariffs||[],t=>tariffView(t,p),'Тарифов пока нет.')}<div class="actions">${actions.renew_link?`<button class="button secondary" type="button" data-open-telegram="${esc(actions.renew_link)}">Открыть покупку в боте</button>`:''}</div>`},'Активных продуктов пока нет.'):list(tariffs,t=>`<strong>${esc(t.name)}</strong><div class="line"><small>${esc(t.channel_title||'Без канала')}</small><small>${esc(t.duration_days)} дн. • ${esc(t.price_stars)} Stars</small></div>`,'Активных тарифов пока нет.');
const userMarkup=`<article class="card"><div class="head"><h2>Профиль</h2><span class="badge ${profile.has_active_subscription?'good':'warn'}">${esc(profile.status_label||'Нет данных')}</span></div><div class="stack">${rows([{label:'Telegram ID',value:viewer.telegram_id},{label:'Username',value:viewer.username?'@'+viewer.username:'—'},{label:'Доступ до',value:profile.latest_expires_at_label||'—'},{label:'Осталось',value:profile.remaining_label||'—'},{label:'Текущий тариф',value:profile.current_tariff_label||'—'},{label:'Канал',value:profile.current_channel_label||'—'},{label:'Stars оплачено',value:profile.total_stars_amount??0}])}<div class="actions">${actions.renew_link?`<button class="button" type="button" data-open-telegram="${esc(actions.renew_link)}">Продлить доступ</button>`:''}${actions.bot_link?`<button class="button secondary" type="button" data-open-telegram="${esc(actions.bot_link)}">Открыть бота</button>`:''}</div></div></article><article class="card"><div class="head"><h2>Рефералы</h2><span class="badge">Бонусы</span></div><div class="stack">${rows([{label:'Код',value:referrals.referral_payload||profile.referral_payload||'—'},{label:'Ссылка',value:referrals.referral_link||'—'},{label:'Приглашено',value:referrals.invited_users_count??0},{label:'Оплатили',value:referrals.paid_referrals_count??0},{label:'Начислено дней',value:referrals.earned_days??0},{label:'Ожидает начисления',value:referrals.pending_reward_days??0}])}</div></article><article class="card"><div class="head"><h2>Продукты и тарифы</h2><span class="badge">${esc(String(products.length||tariffs.length))}</span></div>${productBlock}</article><article class="card"><div class="head"><h2>История оплат</h2><span class="badge">${esc(String(payments.length))}</span></div>${list(payments,i=>`<strong>${esc(i.tariff_name||'Без тарифа')}</strong><div class="line"><small>${esc(i.amount_label||'—')}</small><small>${esc(i.paid_at_label||'без даты')}</small></div><div class="line"><small>${esc(i.channel_title||'Без канала')}</small><small>${esc(i.provider||'—')}</small></div>`,'Оплат пока нет.')}</article><article class="card"><div class="head"><h2>Промокоды</h2><span class="badge">${esc(String(promos.length))}</span></div>${list(promos,i=>`<strong>${esc(i.code)} • ${esc(i.discount_label||'—')}</strong><div class="line"><small>${esc(i.tariff_name||'Любой тариф')}</small><small>${esc(i.status_label||'—')}</small></div><div class="line"><small>${esc(i.campaign_name||'Без кампании')}</small><small>${esc(i.valid_until_label||'без срока')}</small></div>`,actions.promo_command?`Активных промокодов нет. Активируй ${actions.promo_command} в чате бота.`:'Активных промокодов нет.')}</article><article class="card"><div class="head"><h2>Поддержка</h2><span class="badge ${support.open_ticket?'warn':'good'}">${support.open_ticket?'Есть открытый тикет':'Всё спокойно'}</span></div><div class="stack">${rows([{label:'Открыто',value:support.open_count??0},{label:'Закрыто',value:support.closed_count??0}])}${support.open_ticket?rows([{label:'Тикет',value:'#'+support.open_ticket.id},{label:'Категория',value:support.open_ticket.category_label||'—'},{label:'Статус',value:support.open_ticket.status_label||'—'},{label:'Обновлено',value:support.open_ticket.updated_at_label||'—'}]):`<div class="empty">${esc(actions.support_command?`Открытых обращений нет. Используй ${actions.support_command} в чате бота.`:'Открытых обращений нет.')}</div>`}${list(support.recent_tickets||[],i=>`<strong>#${esc(i.id)} • ${esc(i.category_label||'—')}</strong><div class="line"><small>${esc(i.status_label||'—')}</small><small>${esc(i.updated_at_label||'без даты')}</small></div>`,'Истории обращений пока нет.')}<div class="actions">${actions.support_link?`<button class="button secondary" type="button" data-open-telegram="${esc(actions.support_link)}">Открыть поддержку в боте</button>`:''}</div></div></article>`;
app.innerHTML=userMarkup+(adminData?renderAdmin(adminData):'');attachControls()}
async function boot(){if(!initData){app.innerHTML=`<article class="card"><div class="error">Нет initData. Открой этот кабинет из Telegram, чтобы Mini App смог подтвердить твою сессию.</div></article>`;return}try{await request(`${basePath}/api/auth`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:initData})});const bootstrap=await request(`${basePath}/api/bootstrap`,{headers:{'X-Telegram-Init-Data':initData}});let adminData=null;if(bootstrap.data&&bootstrap.data.viewer&&bootstrap.data.viewer.is_admin){try{adminData=(await request(`${basePath}/api/admin/dashboard`,{headers:{'X-Telegram-Init-Data':initData}})).data}catch(_e){adminData=null}}renderCabinet(bootstrap.data,adminData)}catch(error){app.innerHTML=`<article class="card"><div class="error">${esc(error.message||'Не удалось загрузить данные кабинета.')}</div></article>`}}
boot();
</script></body></html>
