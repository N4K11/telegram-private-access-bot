<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Access Cabinet</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:light;--bg:#f3f5f1;--panel:rgba(255,255,255,.88);--text:#18342f;--muted:#60776f;--line:rgba(24,52,47,.08);--accent:#2e7e6d;--warn:#cb705d;--shadow:0 18px 42px rgba(24,52,47,.08);font-family:"Segoe UI",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,rgba(127,199,183,.24),transparent 24%),radial-gradient(circle at left center,rgba(169,210,234,.20),transparent 24%),var(--bg);color:var(--text)}.shell{width:min(1120px,100%);margin:0 auto;padding:18px 12px 36px}.hero,.card{background:var(--panel);border:1px solid rgba(255,255,255,.74);box-shadow:var(--shadow);backdrop-filter:blur(16px);border-radius:24px}.hero{padding:20px;display:grid;gap:10px}.hero h1{margin:0;font-size:clamp(28px,5vw,40px)}.hero p{margin:0;max-width:62ch;color:var(--muted);line-height:1.5}.eyebrow,.pill,.badge,.tag,.button,input,select{border-radius:999px;font:inherit}.eyebrow,.pill,.badge,.tag{display:inline-flex;align-items:center;gap:8px;width:fit-content;padding:7px 11px;border:1px solid var(--line);background:rgba(255,255,255,.75);color:var(--muted);font-size:12px;font-weight:700}.eyebrow{background:rgba(127,199,183,.16);color:var(--accent)}.badge.good,.tag.good{background:rgba(127,199,183,.16);color:var(--accent)}.badge.warn,.tag.warn{background:rgba(203,112,93,.12);color:#9a4636}.badge.info,.tag.info{background:rgba(169,210,234,.16);color:#24627d}.grid{display:grid;gap:14px;margin-top:16px}.cols2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.cols3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.card{padding:16px}.head,.row,.line,.toolbar,.actions,.pager,.tags{display:flex;flex-wrap:wrap;gap:10px}.head,.row,.line{justify-content:space-between}.head{align-items:center;margin-bottom:12px}.stack,.list{display:grid;gap:10px}.list{margin:0;padding:0;list-style:none}.item,.metric,.empty,.loading,.error{padding:14px;border-radius:18px;background:rgba(255,255,255,.7);border:1px solid var(--line)}.row{padding-bottom:8px;border-bottom:1px solid var(--line)}.row:last-child{padding-bottom:0;border-bottom:0}.label,.hint,.item small{color:var(--muted);font-size:13px}.value{text-align:right;font-weight:600}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.metric strong{display:block;font-size:24px;margin-top:4px}.chart{display:grid;gap:8px}.bar{height:10px;border-radius:999px;background:rgba(24,52,47,.06);overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#7fc7b7,var(--accent))}.button{appearance:none;border:0;padding:10px 14px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}.button.secondary{background:rgba(255,255,255,.8);color:var(--accent);border:1px solid rgba(46,126,109,.14);box-shadow:none}input,select{appearance:none;padding:10px 13px;background:rgba(255,255,255,.8);border:1px solid var(--line);color:var(--text)}input{flex:1 1 180px}.loading::before{content:"";display:inline-block;width:14px;height:14px;margin-right:10px;border-radius:50%;border:2px solid rgba(46,126,109,.18);border-top-color:var(--accent);animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media (max-width:720px){.row{flex-direction:column;align-items:flex-start}.value{text-align:left}}
</style></head><body><main class="shell"><section class="hero"><span class="eyebrow">Telegram Mini App</span><h1>Кабинет доступа</h1><p>Подписка, продукты, тарифы, оплаты, промокоды и поддержка в одном минималистичном кабинете внутри Telegram.</p><div class="tags" id="hero-meta"></div></section><section class="grid cols2" id="app"><article class="card"><div class="loading">Загружаю кабинет...</div></article></section></main><script>
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;if(tg){tg.ready();tg.expand()}const app=document.getElementById('app'),meta=document.getElementById('hero-meta'),basePath=window.location.pathname.replace(/\/$/,'')||'/cabinet',initData=(tg&&tg.initData)||new URLSearchParams(window.location.search).get('initData')||'',state={usersPage:1,paymentsPage:1,supportPage:1,supportTicketId:null,supportInsightsView:'hotspots',lifecycleView:'rules',readModelsView:'overview'};
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const tags=items=>items&&items.length?`<div class="tags">${items.map(i=>`<span class="tag ${esc(i.kind||'')}">${esc(i.label)}</span>`).join('')}</div>`:'';
const rows=items=>items.filter(Boolean).map(i=>`<div class="row"><span class="label">${esc(i.label)}</span><span class="value">${esc(i.value??'—')}</span></div>`).join('');
const list=(items,fn,empty)=>items&&items.length?`<ul class="list">${items.map(i=>`<li class="item">${fn(i)}</li>`).join('')}</ul>`:`<div class="empty">${esc(empty)}</div>`;
const chart=items=>{if(!items||!items.length)return'<div class="empty">Нет данных для графика.</div>';const max=Math.max(...items.map(i=>Number(i.value||0)),1);return`<div class="chart">${items.map(i=>`<div><div class="line"><small>${esc(i.label)}</small><strong>${esc(i.value)}</strong></div><div class="bar"><div class="fill" style="width:${Math.max(8,Math.round(Number(i.value||0)/max*100))}%"></div></div></div>`).join('')}</div>`};
const card=(title,badge,body,badgeCls='')=>`<article class="card"><div class="head"><h3>${esc(title)}</h3><span class="badge ${badgeCls}">${esc(badge)}</span></div><div class="stack">${body}</div></article>`;
const metricGrid=s=>`<div class="metrics"><div class="metric"><span class="label">Пользователи</span><strong>${esc(s.total_users)}</strong></div><div class="metric"><span class="label">Активные подписки</span><strong>${esc(s.active_subscriptions)}</strong></div><div class="metric"><span class="label">Выручка сегодня</span><strong>${esc(s.revenue_today)}</strong></div><div class="metric"><span class="label">Выручка 30 дней</span><strong>${esc(s.revenue_30_days)}</strong></div><div class="metric"><span class="label">Stars оплат</span><strong>${esc(s.stars_payments)}</strong></div><div class="metric"><span class="label">Crypto оплат</span><strong>${esc(s.crypto_payments)}</strong></div></div>`;
const openTelegram=url=>{if(!url)return;if(tg&&typeof tg.openTelegramLink==='function'){tg.openTelegramLink(url);return}window.open(url,'_blank','noopener')};
const attachTelegramButtons=scope=>scope.querySelectorAll('[data-open-telegram]').forEach(btn=>btn.onclick=()=>openTelegram(btn.dataset.openTelegram||''));
async function request(path,options={}){const response=await fetch(path,options);const payload=await response.json().catch(()=>({}));if(!response.ok||payload.ok===false)throw new Error(payload&&payload.error?payload.error:`HTTP ${response.status}`);return payload}
const pager=(kind,page,total)=>`<div class="pager"><button class="button secondary" type="button" data-kind="${kind}" data-dir="prev" ${page<=1?'disabled':''}>Назад</button><span class="pill">Страница ${esc(page)} / ${esc(total)}</span><button class="button secondary" type="button" data-kind="${kind}" data-dir="next" ${page>=total?'disabled':''}>Далее</button></div>`;
const usersList=d=>list(d.items||[],i=>`<strong>${esc(i.display_name||'Пользователь')}</strong><div class="line"><small>ID ${esc(i.telegram_id||'—')} • ${esc(i.status||'—')}</small><small>${esc(i.total_paid||0)} Stars • ${esc(i.paid_count||0)} оплат</small></div><div class="line"><small>${esc(i.role||'user')}${i.is_blocked?' • blocked':''}</small><small>${esc(i.last_seen_at_label||'—')}</small></div>`,'Пользователи по этому фильтру не найдены.')+pager('users',d.page,d.total_pages);
const paymentsList=d=>list(d.items||[],i=>`<strong>${esc(i.user_display_name||'Пользователь')} • ${esc(i.amount_label||'—')}</strong><div class="line"><small>${esc(i.provider_label||i.provider||'—')} • ${esc(i.status||'—')}</small><small>${esc(i.tariff_name||'Без тарифа')}</small></div><div class="line"><small>${esc(i.channel_title||'Без канала')}</small><small>${esc(i.paid_at_label||i.created_at_label||'без даты')}</small></div>`,'Платежи по этому фильтру не найдены.')+pager('payments',d.page,d.total_pages);
const supportQueueTags=item=>{const tagItems=[];if(item.priority_label)tagItems.push({label:item.priority_label,kind:item.priority==='high'||item.priority==='urgent'?'warn':'info'});if(item.sla_bucket_label&&item.is_open)tagItems.push({label:item.sla_bucket_label,kind:item.sla_bucket==='breach'?'warn':item.sla_bucket==='warning'?'info':'good'});if(item.waiting_state_label)tagItems.push({label:item.waiting_state_label,kind:item.waiting_state==='awaiting_admin'?'warn':'info'});if(item.action_lane_label)tagItems.push({label:item.action_lane_label,kind:item.action_lane_key==='reply_now'?'warn':item.action_lane_key==='waiting_user_followup'?'info':'good'});if(item.escalation_lane_label)tagItems.push({label:item.escalation_lane_label,kind:['payment_blocker','access_blocker','reply_breach','stale_high_priority'].includes(item.escalation_lane_key)?'warn':'info'});if(item.is_stale)tagItems.push({label:'Просрочен',kind:'warn'});if(!item.is_open&&item.close_reason_label)tagItems.push({label:item.close_reason_label,kind:'info'});return tags(tagItems)};
const supportPreviewList=items=>list(items||[],i=>`<strong>#${esc(i.id)} • ${esc(i.user_display_name||'Пользователь')}</strong>${supportQueueTags(i)}<div class="line"><small>${esc(i.category_label||i.category||'—')}</small><small>${esc(i.status_label||'—')}</small></div><div class="line"><small>${esc(i.waiting_state_label||i.waiting_state||'—')}</small><small>${esc(i.updated_at_label||'—')}</small></div><div class="line"><small>${esc(i.triage_pack_label||'—')}</small><small>${esc(i.triage_route_label||'—')}</small></div><div class="actions"><button class="button secondary" type="button" data-ticket-id="${esc(i.id)}">Открыть</button></div>`,'Тикетов пока нет.');
const supportList=d=>list(d.items||[],i=>`<strong>#${esc(i.id)} • ${esc(i.user_display_name||'Пользователь')}</strong>${supportQueueTags(i)}<div class="line"><small>${esc(i.category_label||i.category||'—')}</small><small>${esc(i.status_label||'—')}</small></div><div class="line"><small>${esc(i.waiting_state_label||i.waiting_state||'—')}</small><small>${esc(i.updated_at_label||'—')}</small></div><div class="line"><small>${esc(i.triage_pack_label||'—')}</small><small>${esc(i.triage_route_label||'—')}</small></div>${i.triage_sample_titles&&i.triage_sample_titles.length?`<small>${esc(i.triage_sample_titles.join(' • '))}</small>`:''}${i.last_message_preview?`<small>${esc(i.last_message_preview)}</small>`:''}<div class="actions"><button class="button secondary" type="button" data-ticket-id="${esc(i.id)}">Открыть</button></div>`,'Тикетов по этому фильтру пока нет.')+pager('support',d.page,d.total_pages);
const supportInsightsConsole=d=>{
if(!d)return'<div class="empty">No support insight data yet.</div>';
const recent=d.recent_close_summary||{},trend=d.trend_summary||{},pack=d.pack_outcome_summary||{},hotspot=d.sla_hotspot_summary||{},slaQueue=d.sla_queue_summary||{},slaAction=d.sla_action_summary||{},lane=d.action_lane_summary||{},nextAction=d.next_action_summary||{},route=d.action_route_summary||{},triage=d.triage_queue_summary||{},escalation=d.escalation_lane_summary||{},actionMix=d.escalation_action_summary||{},priorityFocus=d.priority_focus_summary||{},watch=d.escalation_watchlist_summary||{},escalationTrend=d.escalation_trend_summary||{},operatorActionTrend=d.operator_action_trend_summary||{};
const sampleTicketButtons=ids=>(ids||[]).slice(0,3).map(id=>`<button class="button secondary" type="button" data-ticket-id="${esc(id)}">#${esc(id)}</button>`).join('');
const triagePlan=d.triage_plan_summary||{},triageConfirm=d.triage_confirm_summary||{},triageApply=d.triage_apply_summary||{},triageApplyRoute=d.triage_apply_route_summary||{},triageApplyActor=d.triage_apply_actor_summary||{},triageApplyReply=d.triage_apply_reply_summary||{},triageApplyActorReply=d.triage_apply_actor_reply_summary||{},triageApplyRouteActor=d.triage_apply_route_actor_summary||{},triageApplyReplyPack=d.triage_apply_reply_pack_summary||{},triageApplyRouteReplyActor=d.triage_apply_route_reply_actor_summary||{},triageApplyFocus=d.triage_apply_focus_summary||{},triageApplyEffectiveness=d.triage_apply_effectiveness_summary||{};const summary=rows([{label:'View',value:d.view_label||'Insights'},{label:'Open tickets',value:d.open_count||0},{label:'Awaiting admin',value:d.awaiting_admin_count||0},{label:'SLA breach',value:d.sla_breach_count||0},{label:'Stale >24h',value:d.stale_open_count||0},{label:'Top hotspot',value:hotspot.top_kind_label?`${hotspot.top_kind_label} / ${hotspot.top_category_label||'?'}`:'?'},{label:'Top SLA queue',value:slaQueue.top_sla_queue_action_label?`${slaQueue.top_sla_queue_action_label} (${slaQueue.top_count||0})`:'?'},{label:'Top SLA action',value:slaAction.top_sla_action_label?`${slaAction.top_sla_action_label} (${slaAction.top_count||0})`:'?'},{label:'Top pack',value:pack.top_pack_label?`${pack.top_pack_label} (${pack.top_pack_resolved_rate_percent}%)`:'?'},{label:'Top action lane',value:lane.top_action_lane_label?`${lane.top_action_lane_label} (${lane.top_action_lane_count||0})`:'?'},{label:'Top next action',value:nextAction.top_next_action_label?`${nextAction.top_next_action_label} (${nextAction.top_next_action_count||0})`:'?'},{label:'Top route',value:route.top_action_route_label?`${route.top_action_route_label} (${route.top_action_route_count||0})`:'?'},{label:'Top triage queue',value:triage.top_triage_queue_label?`${triage.top_triage_queue_label} (${triage.top_count||0})`:'?'},{label:'Top triage plan',value:triagePlan.top_primary_reply_title?`${triagePlan.top_primary_reply_title} (${triagePlan.top_count||0})`:'?'},{label:'Top triage confirm',value:triageConfirm.top_confirm_label?`${triageConfirm.top_confirm_label} (${triageConfirm.top_count||0})`:'?'},{label:'Top triage apply',value:triageApply.top_reply_title?`${triageApply.top_reply_title} (${triageApply.top_count||0})`:'?'},{label:'Top apply route',value:triageApplyRoute.top_reply_title?`${triageApplyRoute.top_reply_title} (${triageApplyRoute.top_ticket_count||0})`:'?'},{label:'Top apply actor',value:triageApplyActor.top_actor_label?`${triageApplyActor.top_actor_label} (${triageApplyActor.top_ticket_count||0})`:'?'},{label:'Top apply reply',value:triageApplyReply.top_reply_title?`${triageApplyReply.top_reply_title} (${triageApplyReply.top_ticket_count||0})`:'?'},{label:'Top actor reply',value:triageApplyActorReply.top_actor_label?`${triageApplyActorReply.top_actor_label} / ${triageApplyActorReply.top_reply_title||triageApplyActorReply.top_reply_key||'?'}`:'?'},{label:'Top route actor',value:triageApplyRouteActor.top_route_label?`${triageApplyRouteActor.top_route_label} / ${triageApplyRouteActor.top_actor_label||'?'}`:'?'},{label:'Top reply pack',value:triageApplyReplyPack.top_reply_title?`${triageApplyReplyPack.top_reply_title} / ${triageApplyReplyPack.top_pack_label||'?'}`:'?'},{label:'Top route reply actor',value:triageApplyRouteReplyActor.top_route_label?`${triageApplyRouteReplyActor.top_route_label} / ${triageApplyRouteReplyActor.top_reply_title||triageApplyRouteReplyActor.top_reply_key||'?'} / ${triageApplyRouteReplyActor.top_actor_label||'?'}`:'?'},{label:'Top apply focus',value:triageApplyFocus.top_source_label?`${triageApplyFocus.top_source_label} / ${triageApplyFocus.top_title||'?'}`:'?'},{label:'Top effectiveness',value:triageApplyEffectiveness.top_source_label?`${triageApplyEffectiveness.top_source_label} / ${triageApplyEffectiveness.top_title||'?'}`:'?'},{label:'Top escalation',value:escalation.top_escalation_lane_label?`${escalation.top_escalation_lane_label} (${escalation.top_escalation_lane_count||0})`:'?'},{label:'Top escalation action',value:actionMix.top_escalation_action_label?`${actionMix.top_escalation_action_label} (${actionMix.top_escalation_action_count||0})`:'?'},{label:'Top priority',value:priorityFocus.top_priority_label?`${priorityFocus.top_priority_label} (${priorityFocus.top_priority_count||0})`:'?'},{label:'Top watch',value:watch.top_watch_label?`${watch.top_watch_label} (score ${watch.top_watch_score||0})`:'?'},{label:'Top escalation trend',value:escalationTrend.top_trend_label?`${escalationTrend.top_trend_label} (${escalationTrend.top_trend_delta>0?'+':''}${escalationTrend.top_trend_delta||0})`:'?'},{label:'Top operator trend',value:operatorActionTrend.top_operator_action_label?`${operatorActionTrend.top_operator_action_label} (${operatorActionTrend.top_current_count||0})`:'?'},{label:'Strongest trend',value:trend.strongest_reason_label?`${trend.strongest_reason_label} (${trend.strongest_delta>0?'+':''}${trend.strongest_delta})`:'?'},{label:'Close window',value:`${recent.window_days||7}d / ${recent.total_closed||0}`}]);
const renderItem=i=>{
if(d.view==='pack_outcomes')return `<strong>${esc(i.label||'Pack')}</strong><div class="line"><small>tickets ${esc(i.ticket_count||0)}</small><small>${esc(i.resolved_rate_percent??0)}% resolved</small></div><div class="line"><small>${esc(i.no_response_rate_percent??0)}% no reply</small><small>${esc(i.duplicate_rate_percent??0)}% duplicate</small></div>${(i.sample_titles||[]).length?`<small>${esc(i.sample_titles.join(' • '))}</small>`:''}`;
if(d.view==='close_trends')return `<strong>${esc(i.label||'Reason')}</strong><div class="line"><small>current window</small><small>${esc(i.current_count??0)}</small></div><div class="line"><small>previous window</small><small>${esc(i.previous_count??0)}</small></div><div class="line"><small>delta</small><small>${esc((i.delta>0?'+':'')+(i.delta??0))}</small></div>`;
if(d.view==='sla_queue'){const sampleTickets=sampleTicketButtons(i.sample_ticket_ids);return `<strong>${esc(i.label||'SLA queue')}</strong><div class="line"><small>${esc(i.top_kind_label||'Hotspot')} • ${esc(i.top_priority_label||'?')}</small><small>tickets ${esc(i.count||0)} (${esc(i.share_percent??0)}%)</small></div><div class="line"><small>high ${esc(i.high_priority_count||0)} | stale ${esc(i.stale_count||0)} | breach ${esc(i.sla_breach_count||0)}</small><small>${esc(i.top_escalation_lane_label||'?')}</small></div><div class="line"><small>${esc(i.top_category_label||'mixed')}</small><small>${esc(i.key||'?')}</small></div>${sampleTickets?`<div class="actions">${sampleTickets}</div>`:''}<small>${esc(i.note||'')}</small>`;}
if(d.view==='sla_actions')return `<strong>${esc(i.label||'SLA action')}</strong><div class="line"><small>${esc(i.kind_label||'Hotspot')} • ${esc(i.category_label||'Category')} • ${esc(i.priority_label||'Priority')}</small><small>tickets ${esc(i.count||0)} (${esc(i.share_percent??0)}%)</small></div><div class="line"><small>${esc(i.action_label||'?')}</small><small>${esc(i.escalation_label||'?')}</small></div><small>${esc(i.note||'')}</small>`;
if(d.view==='action_lanes')return `<strong>${esc(i.label||'Lane')}</strong><div class="line"><small>tickets ${esc(i.count||0)} (${esc(i.share_percent??0)}%)</small><small>high ${esc(i.high_priority_count||0)} | stale ${esc(i.stale_count||0)}</small></div><div class="line"><small>sla warn ${esc(i.sla_warning_count||0)} | breach ${esc(i.sla_breach_count||0)}</small><small>${esc(i.top_category_label||'mixed')}</small></div>`;
