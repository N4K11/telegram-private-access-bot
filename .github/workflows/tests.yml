name: tests

on:
  push:
    branches:
      - main
      - master
      - 'codex/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Quality gate
        run: python -m app.tools.quality_gate --summary-json .tmp/quality-gate.json

      - name: Upload quality gate summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-summary
          path: .tmp/quality-gate.json
          if-no-files-found: error
